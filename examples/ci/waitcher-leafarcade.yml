# Generated by waitcher ci init. Plans on pull requests, applies on main.
# Repository secret WAITCHER_TOKEN_LEAFARCADE: an automation token with read and write
# permissions (waitcher token create). Optional variable WAITCHER_SERVER.
name: Waitcher leafarcade (production)
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: waitcher-leafarcade-production
  cancel-in-progress: false
jobs:
  waitcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAITCHER_SERVER: ${{ vars.WAITCHER_SERVER || 'https://waitcher.dev' }}
      WAITCHER_CONFIG_DIR: ${{ runner.temp }}/waitcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install project dependencies
        working-directory: "examples/leafarcade"
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Install the Waitcher CLI
        run: |
          set -euo pipefail
          curl -fsSL "$WAITCHER_SERVER/downloads/cli.json" -o "$RUNNER_TEMP/cli.json"
          path=$(node -p 'require(process.env.RUNNER_TEMP + "/cli.json").path')
          sha=$(node -p 'require(process.env.RUNNER_TEMP + "/cli.json").sha256')
          curl -fsSL "$WAITCHER_SERVER$path" -o "$RUNNER_TEMP/waitcher-cli.tgz"
          echo "$sha  $RUNNER_TEMP/waitcher-cli.tgz" | sha256sum -c -
          npm install --global "$RUNNER_TEMP/waitcher-cli.tgz"
      - name: Sign in
        env:
          WAITCHER_TOKEN: ${{ secrets.WAITCHER_TOKEN_LEAFARCADE }}
        # Never run auth logout here: it revokes the automation token.
        run: printf %s "$WAITCHER_TOKEN" | waitcher auth login --token-stdin > /dev/null
      - name: Plan
        if: github.event_name == 'pull_request'
        run: waitcher deploy plan --file "examples/leafarcade/waitcher.json" --env "production"
      - name: Apply
        if: github.event_name == 'push'
        run: waitcher deploy apply --file "examples/leafarcade/waitcher.json" --env "production"
